server {
    server_name sneakercare.ddserviceth.com;
    root /var/www/sneakercare/app/dist;
    index index.html;

    # แอปใหม่ (React SPA) เป็นเว็บหลักตัวเดียวแล้ว — try_files fallback ไป index.html เพื่อให้
    # client-side routing (react-router) ทำงานตอนรีเฟรชหน้า/พิมพ์ URL ตรงๆ ได้
    # (ระบบเดิม sneakercare_dashboard.html ปิดใช้งานแล้ว 2026-07-29 — เก็บไฟล์ไว้อ้างอิงที่ legacy/
    # ในโค้ด ไม่ได้ deploy ขึ้นเซิร์ฟเวอร์อีกต่อไป)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    server_tokens off;
    # ตัด cdn.jsdelivr.net/cdnjs.cloudflare.com ออกแล้ว — เคยอนุญาตไว้ให้ระบบเดิม (Tabler icons/xlsx
    # จาก cdnjs) เท่านั้น ไม่มีโค้ดไหนในแอปใหม่โหลดจากสองที่นี้อีกแล้ว — คง fonts.googleapis.com/
    # fonts.gstatic.com ไว้เพราะหน้าต่างพิมพ์สลิปเงินเดือน (printPayslip.ts) ยังคง @import ฟอนต์ Sarabun
    # จาก Google Fonts อยู่ และ CSP ของหน้าหลักมีผลกับ document.write() ในหน้าต่างลูกด้วย (about:blank
    # สืบทอด CSP จากหน้าที่เปิดมันเสมอ ไม่ใช่แค่ origin)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sneakercare.ddserviceth.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sneakercare.ddserviceth.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = sneakercare.ddserviceth.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sneakercare.ddserviceth.com;
    return 404; # managed by Certbot
}
