server {
    server_name sneakercare.ddserviceth.com;
    root /var/www/sneakercare/app/dist;
    index index.html;

    # แอปใหม่ (React SPA) เป็นเว็บหลัก — try_files fallback ไป index.html เพื่อให้
    # client-side routing (react-router) ทำงานตอนรีเฟรชหน้า/พิมพ์ URL ตรงๆ ได้
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ระบบเดิม (single-file HTML) เก็บไว้เป็น fallback ที่ /legacy/ ชั่วคราว
    location /legacy/ {
        alias /var/www/sneakercare/;
        index sneakercare_dashboard.html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdn.jsdelivr.net cdnjs.cloudflare.com; font-src 'self' fonts.gstatic.com cdn.jsdelivr.net; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sneakercare.ddserviceth.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sneakercare.ddserviceth.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = sneakercare.ddserviceth.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sneakercare.ddserviceth.com;
    return 404; # managed by Certbot
}
