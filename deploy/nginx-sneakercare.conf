server {
    server_name sneakercare.ddserviceth.com;

    # Next.js App Router (PM2 on port 3003)
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Next.js fonts / Supabase Cookie buffer size
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    # ระบบเดิมสำหรับแท็บการเงิน/payroll (ยังใช้งานจริงอยู่)
    location /legacy/ {
        alias /var/www/sneakercare/legacy/;
        index sneakercare_dashboard.html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sneakercare.ddserviceth.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sneakercare.ddserviceth.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = sneakercare.ddserviceth.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sneakercare.ddserviceth.com;
    return 404; # managed by Certbot
}
